version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # NOTE: "pip" ecosystem only watches [project.dependencies], not
  # [dependency-groups]. Dev deps (ruff, pyyaml, pytest) are updated
  # manually or by running `uv lock --upgrade`.
