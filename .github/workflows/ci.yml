name: validate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

  push:
    branches: [main]
    paths: &ci_paths
      - '.gitignore'
      - 'README.md'
      - 'SECURITY.md'
      - 'CITATION.cff'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.agents/skills/skill-discovery'
      - 'skills/**'
      - 'docs/**'
      - 'proposals/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-dev
      - name: Validate CI policy
        run: uv run python3 scripts/validate-ci.py
      - name: Check version consistency
        run: uv run python3 scripts/check-version-consistency.py
      - name: Check README tree
        run: uv run python3 scripts/check-readme-tree.py
      - name: Check expired freshness markers
        run: uv run python3 scripts/check-expiry.py
      - name: Lint Python with ruff
        run: uv run ruff check .github/scripts/ scripts/
      - name: Check portable payload references
        run: uv run python .github/scripts/ci-check.py
      - name: Validate Agent Skills format with skills-ref
        run: 'uvx --from git+https://github.com/agentskills/agentskills.git@69ef37e#subdirectory=skills-ref skills-ref validate skills/skill-discovery'
      - name: Validate offline discovery evaluation fixtures
        run: uv run python scripts/validate-evaluation-fixtures.py
      - name: Audit dependencies for vulnerabilities
        run: uv audit --preview-features audit

  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-dev
      - name: Run validator unit tests
        run: uv run python .github/scripts/test_validators.py
      - name: Run integration tests
        run: uv run python -m pytest .github/scripts/test_integration.py -v
      - name: Run validate-skill tests
        run: uv run python scripts/test_validate_skill.py
      - name: Validate documentation and skill payload
        run: uv run python .github/scripts/validate-docs.py

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    concurrency:
      group: external-contract-monitor
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-dev
      - name: Verify and safely auto-fix external contracts
        id: verify-contracts
        run: uv run python .github/scripts/verify-marketplace-urls.py --fix
      - name: Commit timestamp-only refresh to main
        if: steps.verify-contracts.outputs.canonical_url_fix_count == '0' && steps.verify-contracts.outputs.timestamp_refresh_count != '0'
        run: |
          git add docs/evidence-urls.json
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -m "chore: refresh verification timestamps" --signoff
          git push origin HEAD:main
      - name: Open PR for canonical URL corrections
        if: steps.verify-contracts.outputs.canonical_url_fix_count != '0'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/evidence-urls.json
          sign-commits: true
          labels: needs:semantic-review
          commit-message: "chore: auto-fix URL drift detected by contract monitor"
          title: "chore: auto-fix URL drift detected by contract monitor"
          body: |
            The scheduled external-contract monitor completed bounded checks
            for ${{ steps.verify-contracts.outputs.checked_count }} manifest
            contract(s).

            - Verification timestamps refreshed: ${{ steps.verify-contracts.outputs.timestamp_refresh_count }}
            - Canonical URL corrections: ${{ steps.verify-contracts.outputs.canonical_url_fix_count }}

            This change contains canonical URL corrections that require
            semantic review of the affected provider contract before merging.
            Timestamp-only refreshes are committed directly to main and no
            longer open pull requests.
          branch: automation/external-contract-drift
          delete-branch: true
      - name: Check research expiry and create issues
        run: uv run python .github/scripts/verify-marketplace-urls.py --check-expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Weekly repo health checks
        run: uv run python scripts/cron-health.py
