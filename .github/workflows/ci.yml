name: validate

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: &ci_paths
      - '.gitignore'
      - 'README.md'
      - 'SECURITY.md'
      - '.agents/skills/skill-discovery'
      - 'skills/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths: *ci_paths

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      VENV_PYTHON: .venv/bin/python
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install validation dependency
        run: |
          python3 -m venv .venv
          $VENV_PYTHON -m pip install PyYAML==6.0.3
      - name: Run validator unit tests
        run: $VENV_PYTHON .github/scripts/test_validators.py
      - name: Run validate-skill tests
        run: $VENV_PYTHON scripts/test_validate_skill.py
      - name: Check portable payload references
        run: $VENV_PYTHON .github/scripts/ci-check.py
      - name: Validate documentation and skill payload
        run: $VENV_PYTHON .github/scripts/validate-docs.py

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Verify and auto-fix external contracts
        run: python3 .github/scripts/verify-marketplace-urls.py --fix
      - name: Commit auto-fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence-urls.json
          git diff --cached --quiet || git commit -m "chore: auto-fix URL drift detected by contract monitor"
          git push
      - name: Check research expiry and create issues
        run: python3 .github/scripts/verify-marketplace-urls.py --check-expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
