name: validate

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: &ci_paths
      - '.gitignore'
      - 'README.md'
      - 'SECURITY.md'
      - 'CITATION.cff'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.agents/skills/skill-discovery'
      - 'skills/**'
      - 'docs/**'
      - 'proposals/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths: *ci_paths

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-dev
      - name: Validate CI policy
        run: uv run python3 scripts/validate-ci.py
      - name: Check version consistency
        run: uv run python3 scripts/check-version-consistency.py
      - name: Check README tree
        run: uv run python3 scripts/check-readme-tree.py
      - name: Lint Python with ruff
        run: uv run ruff check .github/scripts/ scripts/
      - name: Check portable payload references
        run: uv run python .github/scripts/ci-check.py
      - name: Audit dependencies for vulnerabilities
        run: uv audit --preview-features audit

  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-dev
      - name: Run validator unit tests
        run: uv run python .github/scripts/test_validators.py
      - name: Run integration tests
        run: uv run python -m pytest .github/scripts/test_integration.py -v
      - name: Run validate-skill tests
        run: uv run python scripts/test_validate_skill.py
      - name: Validate documentation and skill payload
        run: uv run python .github/scripts/validate-docs.py

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-dev
      - name: Verify and auto-fix external contracts
        run: uv run python .github/scripts/verify-marketplace-urls.py --fix
      - name: Commit auto-fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence-urls.json
          git diff --cached --quiet || git commit -m "chore: auto-fix URL drift detected by contract monitor"
          git push
      - name: Check research expiry and create issues
        run: uv run python .github/scripts/verify-marketplace-urls.py --check-expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
