name: validate

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: &ci_paths
      - '.gitignore'
      - 'README.md'
      - 'SECURITY.md'
      - 'CITATION.cff'
      - 'pyproject.toml'
      - '.agents/skills/skill-discovery'
      - 'skills/**'
      - 'docs/**'
      - 'proposals/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths: *ci_paths

env:
  RUFF_VERSION: "0.15.16"

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install "ruff==$RUFF_VERSION" PyYAML==6.0.3
      - name: Validate CI policy
        run: python3 scripts/validate-ci.py
      - name: Lint Python with ruff
        run: ruff check .github/scripts/ scripts/
      - name: Run validator unit tests
        run: python .github/scripts/test_validators.py
      - name: Run validate-skill tests
        run: python scripts/test_validate_skill.py
      - name: Check portable payload references
        run: python .github/scripts/ci-check.py
      - name: Validate documentation and skill payload
        run: python .github/scripts/validate-docs.py

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
      - name: Verify and auto-fix external contracts
        run: python .github/scripts/verify-marketplace-urls.py --fix
      - name: Commit auto-fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence-urls.json
          git diff --cached --quiet || git commit -m "chore: auto-fix URL drift detected by contract monitor"
          git push
      - name: Check research expiry and create issues
        run: python .github/scripts/verify-marketplace-urls.py --check-expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
