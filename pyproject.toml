[project]
name = "skill-discovery"
version = "0.1.2"
description = "A methodology for finding and evaluating agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "CodeSigils" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/CodeSigils/skill-discovery"
Repository = "https://github.com/CodeSigils/skill-discovery"
Issues = "https://github.com/CodeSigils/skill-discovery/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "SIM108",  # ternary operator — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["_common", "_url_contract", "_manifest", "_expiry"]
