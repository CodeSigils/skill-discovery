[project]
name = "skill-discovery"
version = "0.1.1"
description = "A methodology for finding and evaluating agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "CodeSigils" },
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "SIM108",  # ternary operator — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["_common", "_url_contract", "_manifest", "_expiry"]
